# Kazarov project configuration for Chronicle Two. Sourced by tools/kazarov/bin/kazarov.
# shellcheck shell=bash
# shellcheck disable=SC2034  # every variable here is read by the driver
KZ_PROJECT=chronicletwo
KZ_CONFIGS=(ps2-pal ps2-pal-whole)
KZ_DEFAULT_BUILD=ps2-pal
KZ_DEFAULT_RUN=ps2-pal
KZ_ENV_PASS=(SATANSFIDDLE SATANSFIDDLE_CONFIG SATANSFIDDLE_IGNORE)

# Names a configuration and sets how it is built and run. Returns 1 for an unknown name.
kz_config() {
    case $1 in
        ps2-pal|ps2|pal)
            KZ_CONFIG=ps2-pal
            KZ_WHERE=container
            KZ_BUILD_DIR=build/pal
            KZ_CMAKE_ARGS=(-DPLATFORM=PS2)
            KZ_SETUP_TARGETS=(setup)
            KZ_SETUP_STAMP=ps2/asm/pal.split-stamp
            KZ_BUILD_TARGETS=(build ctx objdiff)
            KZ_RUN_TARGETS=(iso)
            KZ_LOCKS=(ps2-pal)
            KZ_REQUIRE_ANY=("rom/pal/Dark Chronicle (PAL).iso" rom/pal/extracted/iso/SCES_511.90)
            KZ_REQUIRE_MESSAGE="kazarov: ps2-pal needs rom/pal/Dark Chronicle (PAL).iso or rom/pal/extracted/iso/SCES_511.90"
            KZ_RUN_ISO="build/pal/Dark Chronicle (PAL Build).iso" ;;
        # The same executable, compiled as retail did: one MWCC run per flag set
        # (docs/SATANSFIDDLE.md). It shares the split, and so its lock, with ps2-pal.
        ps2-pal-whole)
            KZ_WHERE=container
            KZ_BUILD_DIR=build/pal-whole
            KZ_CMAKE_ARGS=(-DPLATFORM=PS2 -DWHOLE_PROGRAM=ON)
            KZ_SETUP_TARGETS=(setup)
            KZ_SETUP_STAMP=ps2/asm/pal.split-stamp
            KZ_BUILD_TARGETS=(build)
            KZ_RUN_TARGETS=(iso)
            KZ_LOCKS=(ps2-pal)
            KZ_REQUIRE_ANY=("rom/pal/Dark Chronicle (PAL).iso" rom/pal/extracted/iso/SCES_511.90)
            KZ_REQUIRE_MESSAGE="kazarov: ps2-pal-whole needs rom/pal/Dark Chronicle (PAL).iso or rom/pal/extracted/iso/SCES_511.90"
            KZ_RUN_ISO="build/pal-whole/Dark Chronicle (PAL Build).iso" ;;
        *) return 1 ;;
    esac
}

# Reports progress after a default build.
kz_after_build() {
    # The report reads objdiff.json, which only the per-unit build writes.
    [ "$KZ_CONFIG" = ps2-pal ] || return 0
    python3 scripts/build/progress_report.py
}

# Checks the rebuilt executable against retail; a mismatch is reported and the run goes on.
kz_after_run_build() {
    BUILD_DIR=$KZ_BUILD_DIR python3 scripts/build/verify.py -c || echo "The build does not match retail; booting it anyway." >&2
}
